services:
  - type: web
    name: relu-datacore-explorer
    env: static
    buildCommand: npm --prefix web-app run build
    staticPublishPath: web-app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
